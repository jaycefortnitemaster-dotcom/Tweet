<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Object Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:#12151c;z-index:3}
h1{font-size:18px;margin:0}.status{font-size:12px;color:#aab3c2}
#stage{position:relative;flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform:scaleX(-1)}
#start{position:absolute;z-index:4;border:0;border-radius:14px;padding:14px 20px;background:#fff;color:#111;font-weight:700;font-size:16px}
#hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#111b;padding:9px 13px;border-radius:999px;font-size:12px;white-space:nowrap}
footer{padding:10px 14px;background:#12151c;font-size:12px;color:#aab3c2;text-align:center}
</style>
</head>
<body>
<div id="app">
<header><h1>📷 Live Object Scanner</h1><div class="status" id="status">Ready</div></header>
<div id="stage">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<button id="start">Start camera</button>
<div id="hint">Point the camera at objects</div>
</div>
<footer>Detection runs in your browser. Camera access stays on this device.</footer>
</div>

<script type="module">
import {ObjectDetector, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

const video=document.querySelector("#video"), canvas=document.querySelector("#canvas");
const ctx=canvas.getContext("2d"), start=document.querySelector("#start");
const status=document.querySelector("#status"), hint=document.querySelector("#hint");
let detector, stream, running=false, lastVideoTime=-1;

function resize(){
  const r=video.getBoundingClientRect();
  const d=devicePixelRatio||1;
  canvas.width=Math.round(r.width*d); canvas.height=Math.round(r.height*d);
  ctx.setTransform(d,0,0,d,0,0);
}
window.addEventListener("resize",resize);

async function init(){
  status.textContent="Loading AI…";
  const vision=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
  );
  detector=await ObjectDetector.createFromOptions(vision,{
    baseOptions:{
      modelAssetPath:"https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite",
      delegate:"GPU"
    },
    runningMode:"VIDEO",
    scoreThreshold:0.45,
    maxResults:20
  });
  status.textContent="AI ready";
}

function draw(results){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  ctx.clearRect(0,0,w,h);
  const vw=video.videoWidth,vh=video.videoHeight;
  if(!vw||!vh)return;
  const scale=Math.max(w/vw,h/vh), dw=vw*scale, dh=vh*scale;
  const ox=(w-dw)/2, oy=(h-dh)/2;
  for(const d of results.detections){
    const b=d.boundingBox;
    const x=ox+b.originX*scale, y=oy+b.originY*scale;
    const bw=b.width*scale,bh=b.height*scale;
    const cat=d.categories[0];
    const label=cat.categoryName || "Object";
    const score=Math.round(cat.score*100);
    ctx.lineWidth=3; ctx.strokeStyle="#00ff88"; ctx.strokeRect(x,y,bw,bh);
    ctx.font="700 14px system-ui";
    const text=`${label} ${score}%`, tw=ctx.measureText(text).width+16;
    ctx.fillStyle="#00ff88"; ctx.fillRect(x,Math.max(0,y-25),tw,25);
    ctx.fillStyle="#06140d"; ctx.fillText(text,x+8,Math.max(17,y-8));
  }
}

async function loop(){
  if(!running)return;
  if(video.readyState>=2 && video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    const results=detector.detectForVideo(video,performance.now());
    draw(results);
  }
  requestAnimationFrame(loop);
}

start.onclick=async()=>{
  try{
    start.disabled=true;
    await init();
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    resize();
    start.style.display="none";
    hint.textContent="Scanning…";
    status.textContent="Scanning";
    running=true; loop();
  }catch(e){
    console.error(e);
    status.textContent="Camera error";
    start.disabled=false;
    start.textContent="Try again";
    hint.textContent="Allow camera access, then try again";
  }
};
</script>
</body>
</html>
